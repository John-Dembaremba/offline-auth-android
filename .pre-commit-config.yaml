repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: android-format
        name: Android format
        entry: make format
        language: system
        pass_filenames: false

      - id: android-lint
        name: Android lint
        entry: make lint
        language: system
        pass_filenames: false
